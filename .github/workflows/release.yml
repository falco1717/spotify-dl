name: Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test Rust CLI
        run: cargo test --locked

      - name: Build installer and checksum
        shell: pwsh
        run: ./installer/build-installer.ps1

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            artifacts/installer/Spotify-DL-Setup.exe `
            artifacts/installer/Spotify-DL-Setup.exe.sha256 `
            --title "Spotify DL ${{ github.ref_name }}" `
            --generate-notes `
            --latest

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spotify-DL-Windows
          path: |
            artifacts/installer/Spotify-DL-Setup.exe
            artifacts/installer/Spotify-DL-Setup.exe.sha256
